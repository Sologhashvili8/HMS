name: Deploy
on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      - name: Sync files
        run: rsync -az --delete --exclude '.git' --exclude '.github' --exclude '.env' --exclude 'hms.bak' ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/HMS/
      - name: Build and restart
        run: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "cd /opt/HMS && docker compose -f docker-compose.prod.yml up -d --build && docker image prune -f"
